# Render Blueprint for Pearch Outreach.
#
# Deliberately close to the ai-prompt-audit service that already runs in this
# workspace — same runtime, build and start commands, same health check — with
# a persistent disk added, which the SQLite database needs to survive deploys.
# Disks require a paid instance type, hence `plan: starter`.
#
# Every secret is `sync: false`, so Render prompts for it when you click Apply
# and nothing sensitive is stored in the repo.

services:
  - type: web
    name: pearch-outreach
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: pearch-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PEARCH_DB_PATH
        value: /var/data/pearch_outreach.db
      - key: PEARCH_USERNAME
        value: pearch
      - key: PEARCH_SEND_ENABLED
        value: "0"
      - key: PEARCH_DEMO_SEED
        value: "0"
      # Render prompts for these on Apply. PEARCH_PASSWORD is the shared
      # sign-in password and is the only one required — the app refuses to
      # serve a public host without it.
      - key: PEARCH_PASSWORD
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
